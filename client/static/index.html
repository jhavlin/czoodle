<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Czoodle</title>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="ie=edge">

    <meta name="google" content="notranslate">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

    <link rel="icon" href="favicon.ico" type="image/x-icon" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />

    <link rel="stylesheet" href="v02/css/colors.css">
    <link rel="stylesheet" href="v02/css/common.css">
    <link rel="stylesheet" href="v02/css/create.css">

    <meta property="og:title" content="Czoodle" />
    <meta property="og:site_name" content="Czoodle" />
    <meta property="og:description" content="Group Polls" />

    <script src="v02/js/encryptionutils.js"></script>
    <script src="v02/js/create.elm.js"></script>
</head>

<body>
    <div
        style="display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; flex-direction: column;">
        <span>CZOODLE</span>
        <span><small>...</small></span>
    </div>

    <script>
        const date = new Date();
        const today = {
            year: date.getFullYear(),
            month: date.getMonth() + 1,
            day: date.getDate(),
        }
        const baseUrl = /(https?:\/\/[^/]*)(\/.*)?/.exec(window.location)[1];
        let app = Elm.Create.CreatePage.init({
            node: document.getElementById('elm-root'),
            flags: { today, baseUrl, languages: navigator.languages || [] },
        });
        app.ports.persist.subscribe(async function (data) {
            try {
                const key = await generateKey();
                const evidence = await sha256(key)
                const { encryptedData, iv } = await encryptJson(data, key);

                const trySave = async () => {
                    const requestKeyResult = await get('/data/v02/requestProjectKey');
                    const nonces = await prove(requestKeyResult.projectKey, requestKeyResult.requiredHashPrefix, requestKeyResult.requiredNoncesCount).promise;
                    const body = {
                        encryptedData,
                        iv,
                        evidence,
                        projectKey: requestKeyResult.projectKey,
                        nonces,
                    };
                    const result = await post('/data/v02/create', body);
                    if (result.result === 'key_used') {
                        trySave()
                    } else if (result.result === 'verification_failed') {
                        // that is bad
                    } else if (result.result === 'created') {
                        app.ports.createdProjectInfo.send({
                            projectKey: result.projectKey,
                            secretKey: key,
                        });
                    }
                }
                trySave();
            } catch (e) {
                console.log(e);
            }
        });
    </script>
</body>

</html>
